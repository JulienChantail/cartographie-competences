<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion — Cartographie DBA</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .login-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 380px;
    }

    .error {
      margin-top: 12px;
      color: #dc2626;
      font-size: 0.95rem;
    }
    
  </style>
</head>

<body>

  <button
  class="back-btn"
  type="button"
  onclick="goBack()">
  ←
</button>

  <div class="login-card">
      
    <h1>Connexion</h1>

    <p>
      Connectez-vous avec votre adresse mail Capgemini et votre mot de passe.
    </p>

    <div class="field">
      <label for="email">Adresse mail</label>
      <input
        id="email"
        type="email"
        placeholder="prenom.nom@capgemini.com"
      />
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        placeholder="Mot de passe"
      />
    </div>

    <button onclick="login()">
      Se connecter
    </button>

    <div id="error-message" class="error"></div>

  </div>

  <script>
    const API_BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? "http://localhost:8000"
      : "/api";

    function goBack() {

      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }

    }


    async function login() {

      const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const password = document
        .getElementById("password")
        .value;

      const errorEl = document.getElementById("error-message");
      errorEl.textContent = "";

      if (!email || !password) {
        errorEl.textContent =
          "Veuillez saisir votre adresse mail et votre mot de passe.";
        return;
      }

      try {

        const response = await fetch(
          `${API_BASE_URL}/auth/login`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.detail || "Connexion refusée"
          );
        }

        sessionStorage.setItem(
          "currentUser",
          data.email
        );

        sessionStorage.setItem(
          "currentRole",
          data.role
        );

        window.location.href = "index.html";

      } catch (err) {

        errorEl.textContent =
          err.message || "Erreur de connexion";

      }
    }

    document
      .getElementById("password")
      .addEventListener("keydown", e => {
        if (e.key === "Enter") {
          login();
        }
      });
  </script>

</body>
</html>
